---
- name: Install WireGuard
  apt:
    name: wireguard
    state: present
    update_cache: true
  become: true

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true
  become: true

- name: Generate server private key
  shell: wg genkey
  register: server_private_key
  args:
    creates: /etc/wireguard/server_private.key
  become: true

- name: Save server private key
  copy:
    content: "{{ server_private_key.stdout }}"
    dest: /etc/wireguard/server_private.key
    mode: '0600'
  become: true
  when: server_private_key.stdout is defined and server_private_key.stdout != ""

- name: Read existing server private key (idempotent re-runs)
  slurp:
    src: /etc/wireguard/server_private.key
  register: server_private_key_file
  become: true

- name: Set server private key fact
  set_fact:
    server_priv_key: "{{ server_private_key_file.content | b64decode | trim }}"

- name: Derive server public key
  shell: echo "{{ server_priv_key }}" | wg pubkey
  register: server_public_key
  changed_when: false
  become: true

- name: Generate client private key
  shell: wg genkey
  register: client_private_key
  args:
    creates: /etc/wireguard/client_private.key
  become: true

- name: Save client private key
  copy:
    content: "{{ client_private_key.stdout }}"
    dest: /etc/wireguard/client_private.key
    mode: '0600'
  become: true
  when: client_private_key.stdout is defined and client_private_key.stdout != ""

- name: Read existing client private key (idempotent re-runs)
  slurp:
    src: /etc/wireguard/client_private.key
  register: client_private_key_file
  become: true

- name: Set client private key fact
  set_fact:
    client_priv_key: "{{ client_private_key_file.content | b64decode | trim }}"

- name: Derive client public key
  shell: echo "{{ client_priv_key }}" | wg pubkey
  register: client_public_key
  changed_when: false
  become: true

- name: Get primary network interface name
  shell: ip route | grep default | awk '{print $5}' | head -n1
  register: primary_interface
  changed_when: false

- name: Deploy server WireGuard config
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
  become: true
  vars:
    server_public_key_val: "{{ server_public_key.stdout }}"
    client_public_key_val: "{{ client_public_key.stdout }}"
    iface: "{{ primary_interface.stdout }}"

- name: Enable and start WireGuard
  systemd:
    name: wg-quick@wg0
    enabled: true
    state: restarted
  become: true

- name: Generate client config file
  template:
    src: client.conf.j2
    dest: /home/ubuntu/client.conf
    mode: '0600'
    owner: ubuntu
    group: ubuntu
  become: true
  vars:
    server_public_key_val: "{{ server_public_key.stdout }}"
    client_priv_key_val: "{{ client_priv_key }}"
